# Alembic configuration. Trimmed to the options this project actually sets -- the stock
# template's commented-out catalogue is in the Alembic docs.

[alembic]
# Resolved against this file (%(here)s), not the working directory, so `alembic` behaves
# the same from python-server/, from /app in the container, and from a test.
script_location = %(here)s/alembic

# Puts the working directory on sys.path, which is what lets env.py `import app`.
prepend_sys_path = .

# Split path lists with os.pathsep. Alembic falls back to legacy space/comma splitting
# when this key is absent, so it is spelled out rather than left to the default.
path_separator = os

# No sqlalchemy.url here on purpose. app/config.py is the one module allowed to read the
# environment, and a URL in this file would be a second source of it -- one that no
# validator touches and that would silently win in some invocations and lose in others.
# env.py injects settings.database_url instead.

# Logging. Consumed by env.py's fileConfig() call.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

# INFO so that "Running upgrade -> <rev>" lands in the container logs on start.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
